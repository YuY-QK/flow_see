# yaml-language-server: $schema=../../../schemas/lesson.schema.json
# 平十法：把减数拆成两部分，先减到 10，再减剩下的。只用场景模板（scene）的配置，竖式用拆分算式图（split-calc）。
# 被减数 a（11–18）、减数 b 是参数；先减几、再减几、得数都由 derived 算出来，自己做时可以换成别的题。
# 默认例子 14 - 8：8 拆成 4 和 4，14 - 4 = 10，10 - 4 = 6。
id: level-ten
title: 平十法
summary: 先减到 10：把减数拆成两部分，先减去个位，再减剩下的
status: published
reviewedAt: 2026-11-05
duration: 1分钟
tags: [平十法, 退位减法, 十几减几, 减法, 十格框]
cover: { text: 14 − 8 }

template: scene
stage: { width: 800, height: 360 }

params:
  a: 14 # 被减数（十几）
  b: 8 # 减数
derived:
  p: a - 10 # 先减去个位，正好减到 10
  q: b - p # 减数里剩下的，接着减
  res: a - b

explore: # 自己做时舞台右侧的出题控件：个位不够减才要用平十法，所以减数至少是个位数加 1
  - { param: a, control: slider, label: 被减数, min: 11, max: 18 }
  - { param: b, control: slider, label: 减数, min: 'a - 9', max: 9 }

objects:
  - id: all # a 个蓝色圆片：第一个十格框是 10，个位的在第二个框里
    type: counters
    count: '{a}'
    layout: tenframe
    size: 46
    at: [50, 30]
    color: blue
  - id: calc # 拆分算式图：b 拆成 p 和 q，a - p = 10，10 - q = 得数
    type: split-calc
    at: [612, 60]
    a: '{a}'
    op: −
    b: '{b}'
    split: b
    parts: ['{p}', '{q}']
    first: { join: [a, p], op: −, value: 10 }
    second: { join: [m, q], op: −, value: '{res}' }
    size: 42
    colors: { a: '@all' } # 算式里的数和图形里的圆片同色，讲到哪一堆，对应的数一起亮

steps:
  - title: 提出问题
    say: '{a} 减 {b} 等于几？我们用平十法来算。'
    do:
      - highlight: calc
  - title: 拆小数
    say: 把 {b} 拆成 {p} 和 {q}，先减 {p}，减到 10。
    do:
      - highlight: all
      - set: { target: calc, show: 1, duration: 0.8s, together: true }
    try:
      task: '{b} 拆成 {p} 和几？'
      choose: { answer: '{q}', min: 1, show: [all] }
      hints:
        - '{b} 里先拿出 {p}，还剩几？'
  - title: 先减到 10
    say: 先减 {p}，{a} 减 {p} 等于 10。
    do:
      - split: { target: all, take: '{p}', as: gone1, offset: [0, -40] }
      - color: { target: gone1, to: gray }
      - hide: { target: gone1, duration: 0.6s }
      - set: { target: calc, show: 2, duration: 0.8s }
      - highlight: all
    try:
      task: '{a} 减 {p} 等于几？'
      choose: { answer: 10, min: 1, show: [all] }
      hints:
        - 把第二个框里的圆片都拿走，剩下几个？
  - title: 再减剩下的
    say: 再减 {q}，10 减 {q} 等于 {res}。
    do:
      - split: { target: all, take: '{q}', as: gone2, offset: [0, -40] }
      - color: { target: gone2, to: gray }
      - hide: { target: gone2, duration: 0.6s }
      - set: { target: calc, show: 3, duration: 0.8s }
      - highlight: [all, calc]
    try:
      task: 10 减 {q} 等于几？
      choose: { answer: '{res}', min: 1, show: [all] }
      hints:
        - 十格框里还有 10 个，再拿走 {q} 个。
  - title: 得出结果
    say: 所以 {a} 减 {b} 等于 {res}。
    do:
      - set: { target: calc, show: 4, duration: 1.2s }
      - highlight: calc

keyPoints:
  - 平十法：把减数拆成两部分，先减到 10，再减剩下的
  - 先减去被减数的个位，正好减到 10
  - '{a} - {b}：{b} 拆成 {p} 和 {q}，{a} - {p} = 10，10 - {q} = {res}'
