<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 书包 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 顶部提手 -->
    <path d="M 40 22 C 40 10, 60 10, 60 22" stroke="#1D4ED8" stroke-width="4" fill="none"/>

    <!-- 侧边水杯袋 -->
    <path d="M 18 54 L 22 54 L 22 76 L 18 73 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5"/>
    <path d="M 78 54 L 82 54 L 82 73 L 78 76 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5"/>

    <!-- 书包主体 -->
    <path d="M 22 80 L 22 42 C 22 24, 78 24, 78 42 L 78 80 C 78 86, 22 86, 22 80 Z" fill="#3B82F6" stroke="#1D4ED8" stroke-width="3"/>

    <!-- 顶盖拉链弧线 -->
    <path d="M 30 38 C 40 30, 60 30, 70 38" stroke="#1E40AF" stroke-width="2.5" fill="none"/>

    <!-- 前侧口袋 -->
    <path d="M 28 52 L 72 52 L 72 78 C 72 82, 28 82, 28 78 Z" fill="#60A5FA" stroke="#1D4ED8" stroke-width="2.5"/>

    <!-- 口袋拉链与装饰扣 -->
    <line x1="29" y1="52" x2="71" y2="52" stroke="#FBBF24" stroke-width="3.5"/>
    <circle cx="50" cy="65" r="4.5" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>

    <!-- 高光 -->
    <path d="M 28 40 C 32 30, 42 26, 52 26" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.45"/>
  </g>
</svg>
