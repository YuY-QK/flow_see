<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 松鼠 -->
  <!-- 标志性蓬松大尾巴（从右后方高高翘起） -->
  <path d="M 52 74 C 74 74 88 64 88 42 C 88 18 72 10 60 12 C 52 14 50 22 56 26 C 64 30 72 38 68 50 C 64 62 56 66 48 68" fill="#D45D22" stroke="#8B2F0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 耳朵 -->
  <path d="M 32 32 L 28 16 L 40 24 Z" fill="#E06D34" stroke="#8B2F0B" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 33 28 L 30 19 L 38 23 Z" fill="#FFAAA6"/>
  <path d="M 60 24 L 72 16 L 68 32 Z" fill="#E06D34" stroke="#8B2F0B" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 62 23 L 70 19 L 67 28 Z" fill="#FFAAA6"/>
  <!-- 身体 -->
  <path d="M 31 72 C 29 58 37 52 50 52 C 63 52 71 58 69 72 C 69 84 63 88 50 88 C 37 88 31 84 31 72 Z" fill="#E06D34" stroke="#8B2F0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 浅色肚皮 -->
  <ellipse cx="50" cy="74" rx="11" ry="10" fill="#FFF2DC"/>
  <!-- 头部（带可爱的胖脸颊） -->
  <path d="M 27 48 C 24 38 34 30 50 30 C 66 30 76 38 73 48 C 73 59 62 64 50 64 C 38 64 27 59 27 48 Z" fill="#E06D34" stroke="#8B2F0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 浅色口鼻脸颊 -->
  <ellipse cx="50" cy="53" rx="10" ry="7" fill="#FFF2DC"/>
  <!-- 眼睛 -->
  <circle cx="40" cy="44" r="3.5" fill="#2D3748"/>
  <circle cx="38.5" cy="42.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="60" cy="44" r="3.5" fill="#2D3748"/>
  <circle cx="58.5" cy="42.5" r="1.2" fill="#FFFFFF"/>
  <!-- 腮红 -->
  <circle cx="33" cy="51" r="3.5" fill="#FFAAA6"/>
  <circle cx="67" cy="51" r="3.5" fill="#FFAAA6"/>
  <!-- 小鼻子与嘴巴 -->
  <path d="M 48 49 L 52 49 L 50 52 Z" fill="#8B2F0B"/>
  <path d="M 46 54 Q 50 57 50 53 Q 50 57 54 54" fill="none" stroke="#8B2F0B" stroke-width="2" stroke-linecap="round"/>
  <!-- 抱在胸前的小松果 -->
  <path d="M 46 64 C 46 60 54 60 54 64 C 54 70 50 73 46 72 Z" fill="#9C5B28" stroke="#683515" stroke-width="2"/>
  <path d="M 44 63 C 47 59 53 59 56 63 Z" fill="#5C2E0C" stroke="#683515" stroke-width="2"/>
  <!-- 两只抱松果的小手爪 -->
  <ellipse cx="43" cy="66" rx="3" ry="2.5" fill="#FFF2DC" stroke="#8B2F0B" stroke-width="2"/>
  <ellipse cx="57" cy="66" rx="3" ry="2.5" fill="#FFF2DC" stroke="#8B2F0B" stroke-width="2"/>
  <!-- 脚爪 -->
  <ellipse cx="41" cy="86" rx="6" ry="4" fill="#E06D34" stroke="#8B2F0B" stroke-width="2.5"/>
  <ellipse cx="59" cy="86" rx="6" ry="4" fill="#E06D34" stroke="#8B2F0B" stroke-width="2.5"/>
  <!-- 高光 -->
  <ellipse cx="37" cy="35" rx="4" ry="2" fill="#FFFFFF" opacity="0.35"/>
</svg>