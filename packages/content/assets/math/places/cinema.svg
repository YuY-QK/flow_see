<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 地点图标：电影院/剧场 (cinema) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 顶部阶梯形装饰艺术山墙 -->
    <rect x="20" y="26" width="60" height="5" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <rect x="28" y="21" width="44" height="5" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <rect x="38" y="16" width="24" height="5" rx="1" fill="#FBBF24" stroke="#B45309" stroke-width="2"/>

    <!-- 影院主建筑墙面 (剧场深玫瑰红) -->
    <rect x="16" y="30" width="68" height="56" fill="#BE123C" stroke="#881337" stroke-width="3"/>

    <!-- 标志性爆米花杯标志 (无文字) -->
    <!-- 蓬松金黄爆米花朵 -->
    <circle cx="45" cy="24" r="3" fill="#FCD34D" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="50" cy="22" r="3.5" fill="#FCD34D" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="55" cy="24" r="3" fill="#FCD34D" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="48" cy="26" r="2.8" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="52" cy="26" r="2.8" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
    <!-- 经典红白条纹爆米花杯身 -->
    <polygon points="44,27 56,27 54,37 46,37" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
    <polygon points="47,27 49,27 48.5,37 47.5,37" fill="#EF4444"/>
    <polygon points="51,27 53,27 52.5,37 51.5,37" fill="#EF4444"/>

    <!-- 影院大门头雨棚 (Marquee 霓虹灯箱) -->
    <rect x="14" y="44" width="72" height="9" rx="2" fill="#F59E0B" stroke="#B45309" stroke-width="2.8"/>
    <!-- 门头跑马灯泡 -->
    <circle cx="20" cy="48.5" r="2" fill="#FEF08A" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="30" cy="48.5" r="2" fill="#FEF08A" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="40" cy="48.5" r="2" fill="#FEF08A" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="50" cy="48.5" r="2" fill="#FEF08A" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="60" cy="48.5" r="2" fill="#FEF08A" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="70" cy="48.5" r="2" fill="#FEF08A" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="80" cy="48.5" r="2" fill="#FEF08A" stroke="#D97706" stroke-width="1.2"/>

    <!-- 门头单处半透明长条高光 -->
    <line x1="17" y1="45.5" x2="83" y2="45.5" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>

    <!-- 左右电影海报灯箱 -->
    <rect x="20" y="58" width="11" height="20" rx="1.5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
    <polygon points="25.5,63 27,67 30,67 27.5,69 28.5,73 25.5,70.5 22.5,73 23.5,69 21,67 24,67" fill="#F59E0B"/>
    <rect x="69" y="58" width="11" height="20" rx="1.5" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.8"/>
    <circle cx="74.5" cy="68" r="3.5" fill="#38BDF8"/>

    <!-- 剧场大门与帷幕装饰 -->
    <rect x="38" y="55" width="24" height="31" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <line x1="50" y1="55" x2="50" y2="86" stroke="#475569" stroke-width="1.8"/>
    <line x1="48" y1="70" x2="48" y2="76" stroke="#FBBF24" stroke-width="2"/>
    <line x1="52" y1="70" x2="52" y2="76" stroke="#FBBF24" stroke-width="2"/>
    <!-- 帷幕披垂 -->
    <path d="M 37 55 C 37 66 42 68 39 86 L 36 86 L 36 55 Z" fill="#9F1239" stroke="#881337" stroke-width="1.8"/>
    <path d="M 63 55 C 63 66 58 68 61 86 L 64 86 L 64 55 Z" fill="#9F1239" stroke="#881337" stroke-width="1.8"/>

    <!-- 门前红地毯与地基 -->
    <line x1="12" y1="86" x2="88" y2="86" stroke="#475569" stroke-width="3"/>
    <rect x="38" y="86" width="24" height="2.5" rx="1" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
  </g>
</svg>
