# yaml-language-server: $schema=./schemas/style.schema.json
# 动画主题（只影响动画画面，不影响界面本身）和导出视频/GIF 的画面样式。
# 界面（按钮、页面）的颜色和字号在 apps/web/src/styles/global.css 的 CSS 变量里；改这里不用改代码。
themes:
  pro:
    name: 专业风
    stageBg: "#FFFFFF"
    stageBorder: "#E6E8EF"
    ink: "#1F2433"
    dim: "#9AA3B5"
    accent: "#1F2A44"
    line: "#C9CEDA"
    labelBg: "#EEF1F7"
    palette: ["#1F2A44", "#3A4A6B", "#56657F", "#2B5D7C"]
    elementInk: "#FFFFFF"
    radius: 6
    font: inherit
  flat:
    name: 简洁扁平
    stageBg: "#F4F7FF"
    stageBorder: "#DCE5FF"
    ink: "#1F2433"
    dim: "#A9B6DA"
    accent: "#2F5FE0"
    line: "#BFCBEF"
    labelBg: "#DCE5FF"
    palette: ["#2F5FE0", "#C25A00", "#1E7F4F", "#6B4FD8"]
    elementInk: "#FFFFFF"
    radius: 14
    font: inherit
  cute:
    name: 卡通可爱
    stageBg: "#FFF6EC"
    stageBorder: "#FFE0C2"
    ink: "#5A3A22"
    dim: "#E9B999"
    accent: "#E8603C"
    line: "#F5C9A6"
    labelBg: "#FFE3CC"
    palette: ["#FF8A65", "#7C83FD", "#4DB6AC", "#F6B93B"]
    elementInk: "#FFFFFF"
    radius: 28
    font: '"Comic Sans MS", "PingFang SC", sans-serif'
  chalk:
    name: 手绘黑板
    stageBg: "#24443A"
    stageBorder: "#24443A"
    ink: "#F2F0E6"
    dim: "#7F9A8F"
    accent: "#F6D776"
    line: "#6E8C80"
    labelBg: transparent
    palette: ["#F2F0E6", "#F6D776", "#A8E0C8", "#F4B6B6"]
    elementInk: "#24443A"
    radius: 4
    font: '"Kaiti SC", STKaiti, KaiTi, serif'

# 导出视频 / GIF 时，每一步画成一张图：舞台 + 标题 + 字幕。
export:
  font: '"PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif'
  baseWidth: 1280            # 下面的尺寸都以这个宽度为基准，按实际输出宽度等比缩放
  darkThemes: [chalk]        # 深色的动画主题：字幕直接用主题自己的文字色
  hold: { minMs: 1600, maxMs: 6000 }   # 每一步在视频里最少、最多停留多久
  video: { width: 1280, height: 720, fps: 30, codec: avc1.42001f, bitrate: 3000000 }
  gif: { width: 640, height: 360, colors: 256, fadeFrames: 3 }
  fadeMs: 400                # 两步之间的叠化时长
  layout: { pad: 32, titleH: 44, captionH: 150, captionRadius: 18, captionInset: 28 }
  title: { weight: 700, size: 24 }
  signature: { weight: 600, size: 15 }
  counter: { weight: 400, size: 17, top: 20 }
  step: { weight: 700, size: 28, top: 48 }
  desc: { weight: 400, size: 20, top: 90, lineHeight: 28, maxLines: 2 }
  caption:                   # 字幕框：浅色主题的配色；深色主题用 darkBg / darkBorder，文字用主题色
    bg: "rgba(255,255,255,0.92)"
    border: "rgba(31,36,51,0.08)"
    darkBg: "rgba(0,0,0,0.28)"
    darkBorder: "rgba(255,255,255,0.12)"
    counter: "#5B6275"
    step: "#1F2433"
    desc: "#3A4152"

# 由参数生成画面的模板（fraction、clock）的版式。坐标、尺寸都是舞台坐标；颜色写 site.yaml scene.colors 里的颜色名。
templates:
  fraction:
    stage: { width: 800, height: 450 }
    shapeAt: [280, 215]        # 图形中心
    radius: 150                # 圆的半径
    bar: { width: 440, height: 90 }   # 长条的宽、高
    color: orange              # 涂色的颜色
    caption: { at: [280, 405], size: 30 }    # 图形下方的说明（“平均分成 4 份”）
    fraction: { at: [620, 215], size: 72 }   # 右侧的分数
  clock:
    stage: { width: 800, height: 450 }
    at: [260, 225]             # 钟面中心
    radius: 175                # 钟面半径
    digital: { at: [610, 170], size: 56 }    # 电子钟（读时间时出现）
    caption: { at: [610, 300], size: 30 }    # 说明文字
    secondsPerHour: 6          # 时间连续走动时，走 1 小时用几秒（按 1 倍速）
