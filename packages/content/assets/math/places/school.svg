<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 地点图标：学校 (school) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 校舍主体墙面 (两侧翼楼与主楼) -->
    <rect x="14" y="44" width="22" height="42" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
    <rect x="64" y="44" width="22" height="42" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
    <rect x="36" y="28" width="28" height="58" fill="#FDE68A" stroke="#D97706" stroke-width="3"/>

    <!-- 两侧翼楼坡顶压檐 -->
    <path d="M 12 44 L 38 44 L 36 40 L 14 40 Z" fill="#EA580C" stroke="#C2410C" stroke-width="2.5"/>
    <path d="M 62 44 L 88 44 L 86 40 L 64 40 Z" fill="#EA580C" stroke="#C2410C" stroke-width="2.5"/>

    <!-- 中央钟楼人字坡顶 -->
    <path d="M 33 28 L 50 15 L 67 28 Z" fill="#EA580C" stroke="#C2410C" stroke-width="3"/>

    <!-- 顶部旗杆与红旗 -->
    <line x1="50" y1="15" x2="50" y2="5" stroke="#475569" stroke-width="2.5"/>
    <path d="M 50 5 L 63 9.5 L 50 14 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>

    <!-- 钟楼大钟 (无数字，带指针) -->
    <circle cx="50" cy="36" r="6.5" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
    <circle cx="50" cy="36" r="1" fill="#334155"/>
    <line x1="50" y1="36" x2="50" y2="32" stroke="#334155" stroke-width="2"/>
    <line x1="50" y1="36" x2="54" y2="36" stroke="#334155" stroke-width="2"/>

    <!-- 门厅上半部半圆采光窗 -->
    <path d="M 44 60 C 44 54 56 54 56 60 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>

    <!-- 学校正门 (双开门) -->
    <rect x="43" y="66" width="14" height="20" rx="1" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5"/>
    <line x1="50" y1="66" x2="50" y2="86" stroke="#1D4ED8" stroke-width="2"/>
    <circle cx="48" cy="76" r="1" fill="#FBBF24"/>
    <circle cx="52" cy="76" r="1" fill="#FBBF24"/>

    <!-- 翼楼教室窗户 (8 扇整齐排布) -->
    <!-- 左翼 -->
    <rect x="18" y="50" width="6" height="10" rx="1" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="27" y="50" width="6" height="10" rx="1" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="18" y="68" width="6" height="10" rx="1" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="27" y="68" width="6" height="10" rx="1" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
    <!-- 右翼 -->
    <rect x="67" y="50" width="6" height="10" rx="1" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="76" y="50" width="6" height="10" rx="1" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="67" y="68" width="6" height="10" rx="1" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="76" y="68" width="6" height="10" rx="1" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>

    <!-- 地基与阶梯 -->
    <line x1="10" y1="86" x2="90" y2="86" stroke="#78350F" stroke-width="3"/>
    <rect x="38" y="86" width="24" height="3" rx="1" fill="#CBD5E1" stroke="#64748B" stroke-width="1.8"/>

    <!-- 钟楼顶单处半透明高光 -->
    <path d="M 37 26 L 48 17" stroke="#FFFFFF" stroke-width="3" opacity="0.35"/>
  </g>
</svg>
