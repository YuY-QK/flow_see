# yaml-language-server: $schema=../../schemas/curriculum.schema.json
# 一年级数学。单元和知识点的顺序就是页面上的顺序；已有单元 id 不改。
subject: math
grade: 1
units:
  # ───── 上册 ─────
  - id: numbers-10
    title: 10 以内数的认识
    term: 1
    domain: number
    lessons:
      - count-to-10
      - compare-within-10
      - cardinal-ordinal
      - zero
      - order-within-10
      - compose-10
  - id: add-sub-10
    title: 10 以内的加减法
    term: 1
    domain: number
    lessons:
      - add-meaning
      - sub-meaning
      - add-sub-by-bond
  - id: add-within-20            # 已有
    title: 20 以内的进位加法
    term: 1
    domain: number
    lessons:
      - make-ten
      - count-on
      - commute-add
  - id: clock            # 已有
    title: 认识钟表
    term: 1
    domain: number
    lessons:
      - clock-basics
      - clock-half
  - id: compare-quantity
    title: 比一比
    term: 1
    domain: geometry
    lessons:
      - { id: compare-height-length, title: 比高矮、比长短 }
      - { id: compare-size-weight, title: 比大小、比轻重 }
  - id: solids-intro
    title: 认识立体图形
    term: 1
    domain: geometry
    lessons:
      - { id: solids-intro, title: 认识立体图形 }
  - id: classify-1
    title: 分类与整理
    term: 1
    domain: stats
    lessons:
      - classify-single
      - { id: classify-count, title: 分类后数一数 }
  # ───── 下册 ─────
  - id: numbers-100
    title: 100 以内数的认识
    term: 2
    domain: number
    lessons:
      - count-to-100
      - place-value-100
      - order-compare-100
  - id: subtract-within-20            # 已有
    title: 20 以内的退位减法
    term: 2
    domain: number
    lessons:
      - borrow-ten
      - level-ten
      - think-add-for-sub
  - id: add-sub-100-oral
    title: 100 以内的加法和减法（一）
    term: 2
    domain: number
    lessons:
      - tens-add-sub
      - two-digit-add
      - two-digit-sub
      - column-intro
      - continuous-add-sub
  - id: money-1
    title: 认识人民币
    term: 2
    domain: number
    lessons:
      - { id: money-intro, title: 认识元、角、分与换算 }
      - { id: money-shopping-1, title: 简单的购物计算 }
  - id: shapes-2d
    title: 认识平面图形
    term: 2
    domain: geometry
    lessons:
      - { id: shapes-2d-intro, title: 长方形、正方形、三角形、圆 }
      - { id: shapes-compose, title: 图形的拼组 }
  - id: classify-2
    title: 分类与整理
    term: 2
    domain: stats
    lessons:
      - classify-multi
      - { id: data-collect-1, title: 简单数据的收集与整理 }
