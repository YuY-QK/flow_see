# yaml-language-server: $schema=../../../schemas/lesson.schema.json
id: cardinal-ordinal
title: 几个和第几个
summary: “几个”是一共几个，“第几个”只是其中一个
status: published
reviewedAt: 2026-11-19
duration: 1分钟
tags: [几个, 第几个, 基数, 序数, 排队]
recommended: true
cover: { text: 第4 }
related: [count-to-10]

template: scene
stage: { width: 800, height: 360 }

params:
  n: 4
explore:
  - { param: n, control: slider, label: 第几个, min: 2, max: 7 }

objects:
  - id: animals
    type: item-set
    items:
      - { asset: rabbit }
      - { asset: cat }
      - { asset: dog }
      - { asset: chick }
      - { asset: duck }
      - { asset: monkey }
      - { asset: bear }
      - { asset: squirrel }
    layout: row
    size: 64
    gap: 14
    at: [40, 120]
  - id: arrow
    type: arrow
    from: [40, 230]
    to: [660, 230]
    color: dim
  - id: t1
    type: label
    text: '{n} 个'
    at: [640, 60]
    hidden: true
  - id: t2
    type: label
    text: '第 {n} 个'
    at: [640, 60]
    hidden: true

steps:
  - title: 排好队
    say: 小动物排好队，从左往右数。
    do:
      - highlight: arrow

  - title: 几个
    say: 左边 {n} 个，要把前 {n} 个都圈起来。
    do:
      - show: t1
      - repeat: '{n}'
        do:
          - highlight: { target: 'animals.{i}', together: true }

  - title: 第几个
    say: 第 {n} 个，只是其中的一个。
    do:
      - hide: t1
      - show: t2
      - ask: true
      - highlight: 'animals.{n}'
    try:
      task: 点出从左数第 {n} 个。
      tap:
        answer: 'animals.{n}'
        among: ['animals.*']
      hints:
        - 从左边第一个开始数，数到 {n} 停下。

  - title: 比一比
    say: “{n} 个”是一共几个，“第 {n} 个”只有一个。
    do:
      - highlight: 'animals.{n}'

keyPoints:
  - “几个”表示一共有多少
  - “第几个”表示排在哪个位置，只指其中一个
  - 从不同方向数，第几个会不一样
