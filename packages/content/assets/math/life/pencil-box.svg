<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 文具盒 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 盒体底座 -->
    <rect x="13" y="44" width="74" height="28" rx="8" fill="#059669" stroke="#065F46" stroke-width="3"/>

    <!-- 盒盖 -->
    <rect x="13" y="26" width="74" height="28" rx="8" fill="#34D399" stroke="#065F46" stroke-width="3"/>

    <!-- 盒面装饰凹槽线 -->
    <line x1="22" y1="36" x2="78" y2="36" stroke="#10B981" stroke-width="2"/>

    <!-- 锁扣 -->
    <rect x="44" y="48" width="12" height="10" rx="3" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    <circle cx="50" cy="53" r="2" fill="#D97706"/>

    <!-- 盖面高光 -->
    <line x1="22" y1="31" x2="62" y2="31" stroke="#FFFFFF" stroke-width="2" opacity="0.45"/>
  </g>
</svg>
