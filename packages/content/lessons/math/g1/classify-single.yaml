# yaml-language-server: $schema=../../../schemas/lesson.schema.json
id: classify-single
title: 按一个标准分类
summary: 按同一个标准分，每样只放进一类
status: draft
duration: 1分钟
tags: [分类, 整理, 标准]
cover: { text: 分一分 }
related: [count-to-10]

template: scene
stage: { width: 800, height: 420 }

params:
  r: 4
  y: 2

objects:
  - id: items
    type: item-set
    items:
      - { repeat: '{r}', shape: circle, color: red, tags: { color: red } }
      - { repeat: '{y}', shape: circle, color: yellow, tags: { color: yellow } }
    layout: pile
    size: 52
    at: [160, 60]
  - id: binR
    type: shape
    shape: rect
    width: 240
    height: 130
    fill: false
    color: red
    at: [180, 330]
  - id: binY
    type: shape
    shape: rect
    width: 240
    height: 130
    fill: false
    color: yellow
    at: [520, 330]
  - id: labelR
    type: label
    text: 红色
    at: [180, 240]
  - id: labelY
    type: label
    text: 黄色
    at: [520, 240]

steps:
  - title: 一堆水果
    say: 水果乱乱的，按颜色分一分。
    do:
      - highlight: items
  - title: 放进筐里
    say: 红色放左边，黄色放右边。
    do:
      - repeat: '{r}'
        do:
          - move: { target: 'items.{i}', to: binR }
      - repeat: '{y}'
        do:
          - move: { target: 'items.{r + i}', to: binY }
    try:
      task: 按颜色把水果放进筐里。
      sort:
        from: items
        by: color
        bins:
          red: binR
          yellow: binY
      hints:
        - 红色的放进左边红色的筐里。
        - 黄色的放进右边黄色的筐里。
  - title: 数一数
    say: 红色有 4 个，黄色有 2 个。
    do:
      - highlight: binR
      - highlight: binY

keyPoints:
  - 分类时要按同一个标准
  - 每样东西只能分进一类
  - 分好后数一数、记下来
