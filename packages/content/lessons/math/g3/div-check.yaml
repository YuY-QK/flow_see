# yaml-language-server: $schema=../../../schemas/lesson.schema.json
id: div-check
title: 除法的验算
summary: 商 × 除数 + 余数 = 被除数
status: reviewed
reviewedAt: 2026-11-19
duration: 1分钟
tags: [验算, 除法, 余数]
cover: { text: 验算 }
related: [div-column-1, remainder-meaning]

template: scene
stage: { width: 800, height: 420 }

params:
  t: 23
  g: 5
derived:
  q: floor(t / g)
  r: t % g

explore:
  - { param: g, control: slider, label: 除数, min: 2, max: 6 }
  - { param: t, control: slider, label: 被除数, min: 'g + 1', max: '10 * g - 1' }

objects:
  - repeat: '{g}'
    id: 'p{i}'
    type: counters
    count: '{q}'
    layout: grid
    cols: 3
    capacity: '{q}'
    size: 26
    at: ['{35 + (i - 1) * (g > 4 ? 76 : 100)}', 60]
  - id: rest
    type: counters
    count: '{r}'
    layout: row
    size: 26
    color: orange
    at: [35, 240]
  - id: all
    type: counters
    count: 0
    layout: grid
    cols: 8
    size: 26
    at: [520, 60]
  - id: eq
    type: text
    text: '{q} × {g} + {r} = [{t}](blank)'
    size: 36
    at: [520, 330]

steps:
  - title: 分好了
    say: '{t} ÷ {g} = {q} …… {r}，对不对？倒回去算一算。'
    do:
      - repeat: '{g}'
        do:
          - highlight: { target: 'p{i}', together: true }
      - highlight: rest
  - title: 合回去
    say: '把 {g} 份合起来，是 {q} × {g} = {q * g} 个。'
    do:
      - repeat: '{g}'
        do:
          - merge: { target: 'p{i}', into: all }
  - title: 加上余数
    say: '再加上剩下的 {r} 个，正好是 {t} 个。'
    do:
      - merge: { target: rest, into: all }
      - ask: true
      - set: { target: eq, text: '{q} × {g} + {r} = {t}' }
    try:
      task: '{q} × {g} + {r} 等于几？'
      choose:
        answer: '{t}'
        min: 2
        max: 60
  - title: 验算对了
    say: 和被除数一样，说明算对了。
    do:
      - highlight: eq

keyPoints:
  - 有余数的除法可以这样验算：商 × 除数 + 余数 = 被除数
  - 没有余数时，商 × 除数 = 被除数
