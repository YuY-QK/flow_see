<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- 交通素材：公交车 (bus) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 车顶空调/通风罩 -->
    <rect x="75" y="19" width="48" height="6" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="2.5"/>

    <!-- 车身主体 -->
    <path d="M 28 24 L 160 24 Q 176 24 180 40 L 182 60 Q 182 74 172 74 L 162 74 Q 159 60 146 60 Q 133 60 130 74 L 72 74 Q 69 60 56 60 Q 43 60 40 74 L 28 74 Q 22 74 22 68 L 22 30 Q 22 24 28 24 Z"
          fill="#FBBF24" stroke="#B45309" stroke-width="3"/>

    <!-- 下半部装饰腰带 -->
    <path d="M 22 62 L 40 62 Q 43 60 56 60 Q 69 60 72 62 L 130 62 Q 133 60 146 60 Q 159 60 162 62 L 182 62 L 182 65 Q 182 74 172 74 L 162 74 Q 159 60 146 60 Q 133 60 130 74 L 72 74 Q 69 60 56 60 Q 43 60 40 74 L 28 74 Q 22 74 22 68 Z"
          fill="#EA580C" stroke="#9A3412" stroke-width="2.5"/>

    <!-- 车窗（侧面乘客车窗 3 扇） -->
    <rect x="32" y="32" width="22" height="20" rx="4" fill="#BAE6FD" stroke="#0284C7" stroke-width="2.5"/>
    <rect x="60" y="32" width="22" height="20" rx="4" fill="#BAE6FD" stroke="#0284C7" stroke-width="2.5"/>
    <rect x="88" y="32" width="22" height="20" rx="4" fill="#BAE6FD" stroke="#0284C7" stroke-width="2.5"/>

    <!-- 乘客车门（折叠门/双扇玻璃门） -->
    <rect x="116" y="32" width="22" height="40" rx="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5"/>
    <line x1="127" y1="32" x2="127" y2="72" stroke="#0284C7" stroke-width="2"/>
    <rect x="118.5" y="35" width="6.5" height="16" rx="1.5" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="129" y="35" width="6.5" height="16" rx="1.5" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="118.5" y="55" width="6.5" height="12" rx="1.5" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="129" y="55" width="6.5" height="12" rx="1.5" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5"/>

    <!-- 前挡风与司机侧窗 -->
    <path d="M 144 32 L 160 32 Q 171 32 174 42 L 176 52 L 144 52 Z"
          fill="#BAE6FD" stroke="#0284C7" stroke-width="2.5"/>

    <!-- 前车灯与后尾灯 -->
    <rect x="180" y="55" width="4" height="6" rx="2" fill="#FEF08A" stroke="#D97706" stroke-width="2"/>
    <rect x="19" y="55" width="4" height="6" rx="2" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>

    <!-- 前后保险杠 -->
    <rect x="176" y="71" width="8" height="5" rx="2.5" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>
    <rect x="17" y="71" width="8" height="5" rx="2.5" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>

    <!-- 后车轮 -->
    <circle cx="56" cy="74" r="13" fill="#374151" stroke="#1F2937" stroke-width="3"/>
    <circle cx="56" cy="74" r="6" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
    <circle cx="56" cy="74" r="2.5" fill="#1F2937"/>

    <!-- 前车轮 -->
    <circle cx="146" cy="74" r="13" fill="#374151" stroke="#1F2937" stroke-width="3"/>
    <circle cx="146" cy="74" r="6" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
    <circle cx="146" cy="74" r="2.5" fill="#1F2937"/>

    <!-- 车顶单处半透明高光 -->
    <path d="M 32 27 L 155 27" stroke="#FFFFFF" stroke-width="3" opacity="0.35"/>
  </g>
</svg>