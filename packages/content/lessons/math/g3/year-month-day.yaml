# yaml-language-server: $schema=../../../../schemas/lesson.schema.json
# 年、月、日：一年 12 个月，大月 31 天，小月 30 天，2 月特殊。
# 样板知识点（status: draft，任务卡 B11）
id: year-month-day
title: 年、月、日
summary: 一年 12 个月，大月 31 天，小月 30 天，2 月特殊
status: draft
duration: 2分钟
tags: [年月日, 大月, 小月, 日历]
cover: { step: 2, text: 大月小月 }
related: [leap-year, elapsed-days]
recommended: true

template: scene
stage: { width: 800, height: 450 }

params:
  y: 2026

derived:
  isLeap: (y % 4 == 0 && y % 100 != 0) || y % 400 == 0

objects:
  - id: cal
    type: calendar
    year: '{y}'
    month: all
    show: 0
    at: [70, 50]
  - id: q
    type: text
    text: '大月有 [7](blank) 个'
    size: 30
    at: [620, 120]

steps:
  - title: 12 个月
    say: 一年有 12 个月，每个月的天数不一样。
    do:
      - set: { target: cal, show: 12, duration: 4s }
  - title: 大月
    say: 31 天的是大月：1、3、5、7、8、10、12 月。
    do:
      - highlight:
          - cal.month.1
          - cal.month.3
          - cal.month.5
          - cal.month.7
          - cal.month.8
          - cal.month.10
          - cal.month.12
  - title: 小月
    say: 30 天的是小月：4、6、9、11 月。
    do:
      - highlight:
          - cal.month.4
          - cal.month.6
          - cal.month.9
          - cal.month.11

keyPoints:
  - 一年有 12 个月
  - 1、3、5、7、8、10、12 月是大月，每月 31 天
  - 4、6、9、11 月是小月，每月 30 天
  - 2 月平年 28 天，闰年 29 天
