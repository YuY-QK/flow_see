name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'dev/**'
      - 'dev/*'
  pull_request:
    branches:
      - main
      - develop
      - 'dev/**'
      - 'dev/*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test, Build & Lesson Walk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: ESLint check
        run: pnpm lint

      - name: Run unit & integration tests
        run: pnpm test

      - name: Content check, conventions check, typecheck & build
        run: pnpm build

      - name: Walk changed lessons
        run: pnpm check:lessons --changed

      - name: Upload lesson walk report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-walk-results
          path: test-results/lessons/
          if-no-files-found: ignore

