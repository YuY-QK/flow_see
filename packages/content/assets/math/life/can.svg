<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 易拉罐（圆柱体） -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 罐身 -->
    <path d="M 24 24 L 24 74 C 24 86, 76 86, 76 74 L 76 24 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="3"/>

    <!-- 罐身装饰波浪条纹 -->
    <path d="M 24 48 C 42 58, 58 42, 76 52 L 76 62 C 58 52, 42 68, 24 58 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- 顶部金属边与盖面 -->
    <ellipse cx="50" cy="24" rx="26" ry="10" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>
    <ellipse cx="50" cy="24" rx="20" ry="7" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>

    <!-- 拉环 -->
    <path d="M 44 24 C 44 20, 56 20, 56 24 C 56 27, 44 27, 44 24 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
    <circle cx="51" cy="24" r="2" fill="#E2E8F0"/>

    <!-- 罐身纵向高光 -->
    <line x1="31" y1="36" x2="31" y2="72" stroke="#FFFFFF" stroke-width="3" opacity="0.45"/>
  </g>
</svg>
