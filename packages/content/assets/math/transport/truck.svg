<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- 交通素材：卡车/货车 (truck) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 排气管（驾驶室后方竖立） -->
    <path d="M 98 60 L 98 22 Q 98 18 102 18 L 105 18" stroke="#64748B" stroke-width="2.5"/>
    <path d="M 103 16 L 107 18 L 103 20 Z" fill="#64748B"/>

    <!-- 底盘大梁与油箱 -->
    <rect x="22" y="66" width="122" height="7" rx="2" fill="#334155" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="84" y="65" width="18" height="8" rx="2" fill="#94A3B8" stroke="#475569" stroke-width="2"/>

    <!-- 货厢主体 (坚固的大型货运箱) -->
    <rect x="18" y="24" width="78" height="42" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
    <!-- 货厢加强筋（立体凹凸折痕） -->
    <line x1="38" y1="24" x2="38" y2="66" stroke="#B45309" stroke-width="2"/>
    <line x1="57" y1="24" x2="57" y2="66" stroke="#B45309" stroke-width="2"/>
    <line x1="76" y1="24" x2="76" y2="66" stroke="#B45309" stroke-width="2"/>

    <!-- 驾驶室主体 (车头) -->
    <path d="M 102 32 L 126 32 Q 134 32 138 39 L 145 52 Q 148 58 148 64 L 148 72 L 102 72 Z"
          fill="#3B82F6" stroke="#1D4ED8" stroke-width="3"/>

    <!-- 驾驶室车窗与前挡风 -->
    <path d="M 108 38 L 124 38 Q 130 38 133 43 L 138 52 L 108 52 Z"
          fill="#BAE6FD" stroke="#0284C7" stroke-width="2.5"/>

    <!-- 车头散热格栅与保险杠 -->
    <path d="M 142 58 L 147 58 L 147 68 L 142 68" stroke="#1D4ED8" stroke-width="2"/>
    <rect x="144" y="68" width="6" height="6" rx="2" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>

    <!-- 车头大灯 -->
    <circle cx="144" cy="56" r="3" fill="#FEF08A" stroke="#D97706" stroke-width="2"/>

    <!-- 后双车轮（重载双桥） -->
    <!-- 后轮 1 -->
    <circle cx="37" cy="74" r="12" fill="#374151" stroke="#1F2937" stroke-width="3"/>
    <circle cx="37" cy="74" r="5.5" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
    <circle cx="37" cy="74" r="2" fill="#1F2937"/>
    <!-- 后轮 2 -->
    <circle cx="67" cy="74" r="12" fill="#374151" stroke="#1F2937" stroke-width="3"/>
    <circle cx="67" cy="74" r="5.5" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
    <circle cx="67" cy="74" r="2" fill="#1F2937"/>

    <!-- 前车轮 -->
    <circle cx="126" cy="74" r="12" fill="#374151" stroke="#1F2937" stroke-width="3"/>
    <circle cx="126" cy="74" r="5.5" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
    <circle cx="126" cy="74" r="2" fill="#1F2937"/>

    <!-- 货厢顶部单处半透明高光 -->
    <path d="M 23 27 L 90 27" stroke="#FFFFFF" stroke-width="3" opacity="0.35"/>
  </g>
</svg>