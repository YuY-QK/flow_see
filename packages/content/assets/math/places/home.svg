<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 地点图标：家/房子 (home) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 烟囱与轻烟 -->
    <path d="M 70 14 C 70 11 75 10 77 12 C 79 14 77 17 74 17" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <rect x="66" y="20" width="10" height="18" rx="1" fill="#DC2626" stroke="#991B1B" stroke-width="2.5"/>
    <rect x="64" y="18" width="14" height="4" rx="1" fill="#B91C1C" stroke="#991B1B" stroke-width="2"/>

    <!-- 房屋主体墙面 -->
    <rect x="22" y="46" width="56" height="40" rx="2" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/>

    <!-- 屋顶 (红色人字顶) -->
    <path d="M 14 46 L 50 18 L 86 46 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="3"/>

    <!-- 阁楼圆窗 -->
    <circle cx="50" cy="34" r="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2.5"/>
    <line x1="50" y1="28" x2="50" y2="40" stroke="#B91C1C" stroke-width="2"/>
    <line x1="44" y1="34" x2="56" y2="34" stroke="#B91C1C" stroke-width="2"/>

    <!-- 正门 -->
    <path d="M 32 86 L 32 62 C 32 58 46 58 46 62 L 46 86 Z" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5"/>
    <circle cx="42" cy="73" r="1.8" fill="#FBBF24" stroke="#D97706" stroke-width="1.2"/>

    <!-- 窗户与花箱 -->
    <rect x="54" y="58" width="18" height="16" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5"/>
    <line x1="63" y1="58" x2="63" y2="74" stroke="#0284C7" stroke-width="2"/>
    <line x1="54" y1="66" x2="72" y2="66" stroke="#0284C7" stroke-width="2"/>
    <!-- 窗台花箱 -->
    <rect x="52" y="74" width="22" height="6" rx="2" fill="#16A34A" stroke="#14532D" stroke-width="2"/>
    <circle cx="56" cy="74" r="2" fill="#F43F5E"/>
    <circle cx="63" cy="74" r="2" fill="#FACC15"/>
    <circle cx="70" cy="74" r="2" fill="#F43F5E"/>

    <!-- 门前台阶与地基 -->
    <line x1="16" y1="86" x2="84" y2="86" stroke="#854D0E" stroke-width="3"/>
    <rect x="28" y="86" width="22" height="3" rx="1" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>

    <!-- 屋顶单处半透明高光 -->
    <path d="M 22 43 L 48 22" stroke="#FFFFFF" stroke-width="3" opacity="0.35"/>
  </g>
</svg>
