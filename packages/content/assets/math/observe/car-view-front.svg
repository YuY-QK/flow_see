<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 玩具车正视图 (car-view-front) - 车头正面视角 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 左右前轮 (触地支撑) -->
    <rect x="16" y="55" width="9" height="20" rx="3.5" fill="#334155" stroke="#0F172A" stroke-width="2.6"/>
    <rect x="75" y="55" width="9" height="20" rx="3.5" fill="#334155" stroke="#0F172A" stroke-width="2.6"/>

    <!-- 车顶与A柱主体轮廓 -->
    <path d="M 25 48
             L 34 27
             Q 38 25 50 25
             Q 62 25 66 27
             L 75 48
             Z"
          fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.8"/>

    <!-- 车顶天窗侧边缘 -->
    <line x1="42" y1="25" x2="58" y2="25" stroke="#93C5FD" stroke-width="2.2"/>

    <!-- 前挡风玻璃 (浅蓝) -->
    <path d="M 28 47
             L 36 29
             Q 40 28 50 28
             Q 60 28 64 29
             L 72 47
             Z"
          fill="#BAE6FD" stroke="#1D4ED8" stroke-width="2.2"/>

    <!-- 车内后视镜 -->
    <line x1="50" y1="28" x2="50" y2="31" stroke="#475569" stroke-width="1.8"/>
    <rect x="47" y="31" width="6" height="3" rx="1" fill="#475569"/>

    <!-- 前排座椅头枕 (对称) -->
    <rect x="35" y="38" width="8" height="6" rx="3" fill="#1E293B"/>
    <rect x="57" y="38" width="8" height="6" rx="3" fill="#1E293B"/>

    <!-- 下车身主体 (车头引擎盖与翼子板) -->
    <path d="M 22 62
             L 22 52
             Q 22 47 27 47
             L 73 47
             Q 78 47 78 52
             L 78 62
             Z"
          fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.8"/>

    <!-- 左右前车灯 (黄色大灯) -->
    <circle cx="28" cy="53" r="4.5" fill="#FACC15" stroke="#D97706" stroke-width="2.2"/>
    <circle cx="72" cy="53" r="4.5" fill="#FACC15" stroke="#D97706" stroke-width="2.2"/>

    <!-- 前保险杠 -->
    <rect x="20" y="59" width="60" height="11" rx="5" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.6"/>

    <!-- 中网进气格栅 -->
    <rect x="36" y="62" width="28" height="5" rx="2.5" fill="#1E293B" stroke="#0F172A" stroke-width="1.8"/>

    <!-- 左右后视镜 -->
    <path d="M 25 45 L 14 43 Q 12 43 12 47 Q 12 50 15 50 L 24 48 Z" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
    <line x1="14" y1="44" x2="14" y2="49" stroke="#93C5FD" stroke-width="1.5"/>

    <path d="M 75 45 L 86 43 Q 88 43 88 47 Q 88 50 85 50 L 76 48 Z" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
    <line x1="86" y1="44" x2="86" y2="49" stroke="#93C5FD" stroke-width="1.5"/>

    <!-- 单处前挡风玻璃高光 -->
    <path d="M 37 32 L 44 44" stroke="#FFFFFF" stroke-width="2.5" opacity="0.35"/>
  </g>
</svg>