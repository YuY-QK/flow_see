# yaml-language-server: $schema=./schemas/help.schema.json
# 帮助与反馈页（P7）的常见问题。a 里可以换行。
faq:
  - q: 怎么换年级？
    a: 点右上角的年级按钮，选一个年级就能看那个年级的内容。想让每次打开都显示某个年级，到个人中心改“在读年级”。
  - q: 为什么听不到朗读？
    a: |
      先看看设备有没有静音、音量是不是太小；再到“设置 · 朗读”里确认打开了自动朗读。
      有些浏览器不支持朗读，这时朗读开关会隐藏，字幕照常显示。
  - q: 怎么把动画发给别人？
    a: 在知识点页点“分享”，复制链接发给对方。对方打开链接，会从第 1 步开始看。
  - q: 学习记录存在哪里？换了设备怎么办？
    a: 学习记录和作品只保存在当前这台设备的浏览器里，不会上传。换设备后记录不会跟过去；可以在“设置 · 数据”里导出备份，再到新设备上导入。
  - q: 在微信里打开有什么限制？
    a: 微信内置浏览器里可以正常学习。部分手机上朗读或全屏可能不可用；遇到问题时，点右上角“…”选择“在浏览器打开”。
