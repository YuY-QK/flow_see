<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <!-- 铅笔 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 橡皮擦 -->
    <path d="M 28.8 9 L 16 9 C 9.6 9, 9.6 41, 16 41 L 28.8 41 Z" fill="#F472B6" stroke="#DB2777" stroke-width="3"/>

    <!-- 金属套箍 -->
    <rect x="28.8" y="9" width="19.2" height="32" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>
    <line x1="38.4" y1="9" x2="38.4" y2="41" stroke="#94A3B8" stroke-width="2"/>

    <!-- 铅笔木杆三棱面 -->
    <rect x="48" y="9" width="105.6" height="9.6" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
    <rect x="48" y="18.6" width="105.6" height="12.8" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
    <rect x="48" y="31.4" width="105.6" height="9.6" fill="#EAB308" stroke="#CA8A04" stroke-width="2"/>
    <rect x="48" y="9" width="105.6" height="32" fill="none" stroke="#CA8A04" stroke-width="3"/>

    <!-- 削开的木头笔头 -->
    <path d="M 153.6 9 L 185.6 25 L 153.6 41 Q 156.8 33 153.6 25 Q 156.8 17 153.6 9 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>

    <!-- 石墨铅笔芯 -->
    <path d="M 176 20.2 L 188.8 25 L 176 29.8 Z" fill="#374151" stroke="#1F2937" stroke-width="2"/>

    <!-- 笔杆高光 -->
    <line x1="54.4" y1="13.8" x2="144" y2="13.8" stroke="#FFFFFF" stroke-width="2.4" opacity="0.45"/>
  </g>
</svg>
