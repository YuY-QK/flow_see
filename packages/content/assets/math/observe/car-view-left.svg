<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 玩具车左视图 (car-view-left) - 车头朝右，车尾朝左 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 后车轮 (左侧) -->
    <circle cx="30" cy="65" r="10" fill="#334155" stroke="#0F172A" stroke-width="2.6"/>
    <circle cx="30" cy="65" r="4.5" fill="#94A3B8" stroke="#475569" stroke-width="1.8"/>

    <!-- 前车轮 (右侧) -->
    <circle cx="70" cy="65" r="10" fill="#334155" stroke="#0F172A" stroke-width="2.6"/>
    <circle cx="70" cy="65" r="4.5" fill="#94A3B8" stroke="#475569" stroke-width="1.8"/>

    <!-- 车身主体轮廓 -->
    <path d="M 12 64
             L 12 52
             Q 12 48 16 48
             L 26 48
             L 38 28
             Q 40 26 44 26
             L 56 26
             Q 60 26 62 28
             L 72 46
             L 84 48
             Q 88 48 88 53
             L 88 64
             L 80 64
             Q 70 51 60 64
             L 40 64
             Q 30 51 20 64
             Z"
          fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.8"/>

    <!-- 前车灯 (车头右端，黄色) -->
    <path d="M 85 50 Q 88 52 88 55 L 85 56 Z" fill="#FACC15" stroke="#D97706" stroke-width="2"/>

    <!-- 后车灯 (车尾左端，红色) -->
    <path d="M 15 50 Q 12 52 12 55 L 15 56 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>

    <!-- 后车窗 (浅蓝) -->
    <path d="M 39 30 L 47 30 L 47 45 L 28 45 Q 33 36 39 30 Z"
          fill="#BAE6FD" stroke="#1D4ED8" stroke-width="2"/>

    <!-- 前车窗 (浅蓝) -->
    <path d="M 51 30 L 58 30 Q 67 41 70 45 L 51 45 Z"
          fill="#BAE6FD" stroke="#1D4ED8" stroke-width="2"/>

    <!-- 前后车门分割线 (B柱) -->
    <line x1="49" y1="30" x2="49" y2="64" stroke="#1D4ED8" stroke-width="2.2"/>

    <!-- 前后车门把手 -->
    <rect x="42" y="49" width="4" height="2" rx="1" fill="#1D4ED8"/>
    <rect x="54" y="49" width="4" height="2" rx="1" fill="#1D4ED8"/>

    <!-- 后视镜 (位于前窗前侧) -->
    <path d="M 67 43 Q 71 42 71 46 Q 67 47 66 45 Z" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.8"/>

    <!-- 车顶天窗轮廓线 -->
    <line x1="43" y1="26" x2="57" y2="26" stroke="#93C5FD" stroke-width="2"/>

    <!-- 单处车窗高光 -->
    <path d="M 53 33 L 64 43" stroke="#FFFFFF" stroke-width="2.5" opacity="0.35"/>
  </g>
</svg>