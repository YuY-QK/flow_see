# yaml-language-server: $schema=../schemas/example.schema.json
id: tcp-handshake
title: TCP 三次握手
category: 网络协议
featured: true
summary: 建立连接前，双方要确认彼此都能收发消息。
template: message
theme: flat
elements:
  - 客户端
  - 服务器
steps:
  - from: 客户端
    to: 服务器
    label: SYN
    title: 客户端发送 SYN
    desc: “你好，我想和你建立连接。”
  - from: 服务器
    to: 客户端
    label: SYN + ACK
    title: 服务器回复 SYN + ACK
    desc: “收到！我也准备好了，你能听到我吗？”
  - from: 客户端
    to: 服务器
    label: ACK
    title: 客户端发送 ACK
    desc: “能听到！那我们开始吧。”连接建立。
