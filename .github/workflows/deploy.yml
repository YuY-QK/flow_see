# 部署到 Cloudflare Pages（网页 + /api 分享接口 + KV）
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 添加：
#   CLOUDFLARE_API_TOKEN   权限：Account · Cloudflare Pages · Edit；Account · Workers KV Storage · Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 控制台右侧栏的 Account ID
# 推送到 main → 生产环境；其他分支可在 Actions 页手动运行 → 预览地址。
name: 部署到 Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # 内容检查 + 类型检查 + 打包
      - run: pnpm build
      - name: 准备 KV 命名空间和 Pages 项目
        run: node scripts/cf-setup.mjs
      - name: 发布
        run: pnpm exec wrangler pages deploy --branch "${{ github.ref_name }}" --commit-dirty=true
