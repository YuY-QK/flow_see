# yaml-language-server: $schema=../../../schemas/lesson.schema.json
id: classify-single
title: 按一个标准分类
summary: 按同一个标准分，每样只放进一类
status: published
reviewedAt: 2026-11-19
duration: 1分钟
tags: [分类, 整理, 标准, 统计表]
cover: { text: 分一分 }
related: [classify-count, classify-multi]

template: scene
stage: { width: 800, height: 420 }

params:
  r: 4
  y: 3
explore:
  - { param: r, control: slider, label: 红色几个, min: 1, max: 5 }
  - { param: y, control: slider, label: 黄色几个, min: 1, max: 5 }

objects:
  - id: items
    type: item-set
    items:
      - { repeat: '{r}', shape: circle, color: red, tags: { color: red } }
      - { repeat: '{y}', shape: circle, color: yellow, tags: { color: yellow } }
    layout: pile
    size: 52
    at: [80, 60]
  - id: binR
    type: shape
    shape: rect
    width: 240
    height: 130
    fill: false
    color: red
    at: [180, 330]
  - id: binY
    type: shape
    shape: rect
    width: 240
    height: 130
    fill: false
    color: yellow
    at: [520, 330]
  - id: tbl
    type: table
    rows:
      - [颜色, 红色, 黄色]
      - [个数, '[{r}](blank)', '[{y}](blank)']
    headerCol: true
    colWidth: 100
    at: [460, 60]
    hidden: true

steps:
  - title: 一堆圆片
    say: 圆片乱乱的，按颜色分一分。
    do:
      - highlight: items
  - title: 放进筐里
    say: 红色放左边，黄色放右边。
    do:
      - repeat: '{r}'
        do:
          - move: { target: 'items.{i}', to: binR }
      - repeat: '{y}'
        do:
          - move: { target: 'items.{r + i}', to: binY }
    try:
      task: 按颜色把圆片放进筐里。
      sort:
        from: items
        by: color
        bins:
          red: binR
          yellow: binY
      hints:
        - 红色的放进红框里。
  - title: 数一数
    say: '红色 {r} 个，黄色 {y} 个。'
    do:
      - show: tbl
      - ask: true
      - set:
          target: tbl
          rows:
            - [颜色, 红色, 黄色]
            - [个数, '{r}', '{y}']
    try:
      task: 红色有几个？
      choose:
        answer: '{r}'
        min: 1
        max: 6
  - title: 记下来
    say: 分好、数好，记在统计表里。
    do:
      - highlight: tbl

keyPoints:
  - 分类时要按同一个标准
  - 每样东西只能分进一类
  - 分好后数一数、记下来
