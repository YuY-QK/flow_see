# yaml-language-server: $schema=./schemas/texts.schema.json
# 界面文案：分组 → 键 → 文字。代码里用 t('分组.键') 读取，不要在代码里写中文（pnpm test 会检查）。
# - 文字里的 {名字} 由代码代入，如 t('common.step_n', { n: 3 })。
# - common 是多处共用的文案；其余分组按页面或组件命名。
# - 键是文字拼音的前几个音节（自动生成），要改文字直接改这里的值即可，不用改键。
# - 新增文案：在对应分组里加一行，再在代码里 t('分组.键')；没用到的键、缺少的键都会被检查出来。
