<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100" width="150" height="100">
  <!-- 礼品盒（长方体，长约为高的 1.9 倍） -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 盒子顶面 -->
    <path d="M 46 21 L 138 21 L 104 39 L 12 39 Z" fill="#FFA8A8" stroke="#C92A2A" stroke-width="3"/>
    <!-- 盒子正前面（长 92，高 48） -->
    <path d="M 12 39 L 104 39 L 104 87 L 12 87 Z" fill="#FF6B6B" stroke="#C92A2A" stroke-width="3"/>
    <!-- 盒子右侧面 -->
    <path d="M 104 39 L 138 21 L 138 69 L 104 87 Z" fill="#EE5253" stroke="#C92A2A" stroke-width="3"/>

    <!-- 顶面十字丝带 -->
    <path d="M 23.5 33 L 34.5 27 L 126.5 27 L 115.5 33 Z" fill="#FFD43B" stroke="#D97706" stroke-width="2"/>
    <path d="M 52 39 L 86 21 L 98 21 L 64 39 Z" fill="#FFD43B" stroke="#D97706" stroke-width="2"/>

    <!-- 正面与右侧面丝带 -->
    <path d="M 52 39 L 64 39 L 64 87 L 52 87 Z" fill="#FFD43B" stroke="#D97706" stroke-width="2"/>
    <path d="M 115.5 33 L 126.5 27 L 126.5 75 L 115.5 81 Z" fill="#FFD43B" stroke="#D97706" stroke-width="2"/>

    <!-- 顶面蝴蝶结 -->
    <path d="M 75 29 C 56 3, 45 15, 70 30 Z" fill="#FFD43B" stroke="#D97706" stroke-width="2.5"/>
    <path d="M 75 29 C 94 3, 105 15, 80 30 Z" fill="#FFD43B" stroke="#D97706" stroke-width="2.5"/>
    <path d="M 72 31 Q 63 39 59 46" stroke="#D97706" stroke-width="2.5" fill="none"/>
    <path d="M 78 31 Q 87 39 91 46" stroke="#D97706" stroke-width="2.5" fill="none"/>
    <circle cx="75" cy="29" r="5" fill="#FFE066" stroke="#D97706" stroke-width="2.5"/>

    <!-- 正面左上高光 -->
    <line x1="18" y1="45" x2="45" y2="45" stroke="#FFFFFF" stroke-width="2.5" opacity="0.45"/>
  </g>
</svg>
