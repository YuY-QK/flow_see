# yaml-language-server: $schema=../../schemas/curriculum.schema.json
# 二年级数学。单元和知识点的顺序就是页面上的顺序；已有单元 id 不改。
subject: math
grade: 2
units:
  # ───── 上册 ─────
  - id: add-within-100
    title: 100 以内的加法（二）
    term: 1
    domain: number
    lessons:
      - column-add-100
  - id: subtract-within-100            # 已有
    title: 100 以内的退位减法
    term: 1
    domain: number
    lessons:
      - break-ten
      - column-sub-100
  - id: multiplication-1            # 已有
    title: 表内乘法（一）
    term: 1
    domain: number
    lessons:
      - mult-meaning
      - times-table-2-5
  - id: multiplication-2-table
    title: 表内乘法（二）
    term: 1
    domain: number
    lessons:
      - times-table-6-9
      - times-table-map
  - id: division-1            # 已有
    title: 表内除法（一）
    term: 1
    domain: number
    lessons:
      - divide-equal
      - divide-by-table
      - division-two-meanings
  - id: money-2
    title: 人民币的应用
    term: 1
    domain: number
    lessons:
      - { id: money-shopping-2, title: 复杂购物（总价、够不够、怎样付） }
  - id: angle-intro
    title: 角的初步认识
    term: 1
    domain: geometry
    lessons:
      - { id: angle-intro, title: 角的初步认识（直角、锐角、钝角） }
  - id: tangram-shapes
    title: 七巧板
    term: 1
    domain: geometry
    lessons:
      - { id: tangram, title: 七巧板与平面图形拼组 }
  - id: observe-1
    title: 观察物体（一）
    term: 1
    domain: geometry
    lessons:
      - { id: observe-directions, title: 从不同方向观察物体 }
  - id: pictograph
    title: 数据收集整理
    term: 1
    domain: stats
    lessons:
      - { id: pictograph, title: 象形统计 }
  # ───── 下册 ─────
  - id: numbers-10000
    title: 万以内数的认识
    term: 2
    domain: number
    lessons:
      - count-to-10000
      - read-write-10000
      - compare-10000
  - id: division-remainder
    title: 有余数的除法
    term: 2
    domain: number
    lessons:
      - remainder-meaning
      - { id: remainder-column, title: 有余数除法的竖式 }
  - id: add-sub-10000
    title: 万以内的加法和减法
    term: 2
    domain: number
    lessons:
      - oral-add-sub-1000
      - column-add-sub-10000
  - id: mass-1
    title: 克和千克
    term: 2
    domain: number
    lessons:
      - { id: gram-kilogram, title: 认识克和千克 }
  - id: time-hms
    title: 时、分、秒
    term: 2
    domain: number
    lessons:
      - { id: hour-minute-second, title: 时、分、秒的关系与换算 }
  - id: rect-square
    title: 长方形和正方形的特征
    term: 2
    domain: geometry
    lessons:
      - { id: rect-square-features, title: 长方形、正方形的特征 }
  - id: length-units
    title: 长度单位
    term: 2
    domain: geometry
    lessons:
      - { id: length-units, title: 分米、毫米、千米 }
      - { id: measure-length, title: 简单的长度测量 }
  - id: survey-1
    title: 数据的收集和整理
    term: 2
    domain: stats
    lessons:
      - { id: survey-table, title: 简单的数据调查与整理 }
