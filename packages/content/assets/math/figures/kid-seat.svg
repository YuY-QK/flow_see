<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 坐着/座位的小朋友 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 课桌后方的椅子靠背 -->
    <path d="M27 34 L27 54 M73 34 L73 54" stroke="#94A3B8" stroke-width="3"/>
    <path d="M24 35 L76 35" stroke="#64748B" stroke-width="4"/>
    <!-- 耳朵 -->
    <circle cx="34" cy="27" r="3" fill="#FCD5B5" stroke="#D4956A" stroke-width="2"/>
    <circle cx="66" cy="27" r="3" fill="#FCD5B5" stroke="#D4956A" stroke-width="2"/>
    <!-- 头部肤色与头发 -->
    <circle cx="50" cy="26" r="14" fill="#FCD5B5" stroke="#D4956A" stroke-width="3"/>
    <path d="M36 26 C36 14 43 13 50 13 C57 13 64 14 64 26 C62 20 57 19 50 19 C43 19 38 20 36 26 Z" fill="#4A2E18" stroke="#2E1A0C" stroke-width="3"/>
    <ellipse cx="45" cy="17" rx="3.5" ry="1.8" transform="rotate(-15 45 17)" fill="#FFFFFF" opacity="0.35"/>
    <!-- 专注的面部神情 -->
    <circle cx="44" cy="26" r="2.2" fill="#2E1A0C"/>
    <circle cx="56" cy="26" r="2.2" fill="#2E1A0C"/>
    <path d="M47 31 Q50 34 53 31" fill="none" stroke="#2E1A0C" stroke-width="2.2"/>
    <circle cx="39" cy="31" r="2.5" fill="#FF9E7A" opacity="0.55"/>
    <circle cx="61" cy="31" r="2.5" fill="#FF9E7A" opacity="0.55"/>
    <!-- 橙色上衣 -->
    <path d="M37 40 L63 40 L66 56 L34 56 Z" fill="#F28C28" stroke="#C25A00" stroke-width="3"/>
    <path d="M46 40 Q50 44 54 40" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- 课桌钢管腿 -->
    <line x1="22" y1="68" x2="22" y2="89" stroke="#64748B" stroke-width="3"/>
    <line x1="17" y1="89" x2="27" y2="89" stroke="#64748B" stroke-width="3"/>
    <line x1="78" y1="68" x2="78" y2="89" stroke="#64748B" stroke-width="3"/>
    <line x1="73" y1="89" x2="83" y2="89" stroke="#64748B" stroke-width="3"/>
    <!-- 课桌木质桌面 -->
    <rect x="13" y="54" width="74" height="16" rx="3" fill="#E0A96D" stroke="#9C6644" stroke-width="3"/>
    <!-- 桌面课本 -->
    <rect x="35" y="57" width="20" height="11" rx="1.5" fill="#FFFFFF" stroke="#2F6FE4" stroke-width="2"/>
    <line x1="45" y1="57" x2="45" y2="68" stroke="#2F6FE4" stroke-width="1.5"/>
    <!-- 桌面铅笔 -->
    <line x1="60" y1="60" x2="67" y2="65" stroke="#E5484D" stroke-width="2.5"/>
    <!-- 端正搭在课桌上的双手 -->
    <circle cx="27" cy="62" r="3.5" fill="#FCD5B5" stroke="#D4956A" stroke-width="2"/>
    <circle cx="73" cy="62" r="3.5" fill="#FCD5B5" stroke="#D4956A" stroke-width="2"/>
  </g>
</svg>
